# lakehouse-gc policy. Every key is validated; unknown keys are errors.
policy_version: 1

# Which Unity Catalog objects the "uc" scanner reads. Use fully qualified names
# (catalog, catalog.schema, catalog.schema.table). Patterns are case-insensitive
# globs, an empty list means "all", and excludes always win.
scope:
  include_catalogs: ["main"]
  exclude_catalogs: ["system", "samples", "__databricks_internal"]
  include_schemas: []             # e.g. ["main.sales", "main.marketing"]
  exclude_schemas: []             # e.g. ["main.scratch"]
  include_tables: []              # e.g. ["main.sales.orders", "main.sales.fact_*"]
  exclude_tables: []

# Excluded resources are not analyzed but stay visible as "excluded" findings.
exclusions:
  - resource_type: table    # must match a scanner's type: catalog, schema, table (uc)
    pattern: "main.finance.*"  # case-insensitive glob on the full name
    reason: "Retention policy"
    expires_on: null
  - resource_type: table     # internal tables backing materialized views
    pattern: "*.__materialization*"
    reason: "Internal tables"
    expires_on: null
  - resource_type: table
    pattern: "*.eventlogs*"
    reason: "Event logs"
    expires_on: null
  - resource_type: example_asset
    pattern: "finance_*"
    reason: "Retention policy"
    expires_on: null
  - resource_type: example_asset
    pattern: "tmp_*"
    reason: "Temporary hold during migration"
    expires_on: 2026-10-30        # inclusive; expired exclusions are ignored with a warning

rules:                            # one section per scanner; every key is optional
  uc:
    stale_table_days: 180         # no data written for this long -> stale
    min_table_size_gb: 10         # only flag stale tables at least this big (0 = any size)
    required_tags: ["cost_center"]
    require_comment: true
    temp_name_patterns: ["tmp_*", "temp_*", "test_*", "scratch_*", "*_tmp", "*_bak", "*_backup", "*_old"]
    check_empty_containers: true
    max_detail_queries: 200       # cap on DESCRIBE DETAIL calls for stale candidates
  example:                        # built-in demo scanner (mock data)
    idle_days: 30
    require_owner: true

scoring:
  governance_weight: 0.5          # normalized against cost_weight
  cost_weight: 0.5
  unknown_penalty: 0.5            # penalty for checks with unavailable evidence, in (0, 1]
  severity_weights: {info: 0, low: 1, medium: 3, high: 5, critical: 8}
  grade_boundaries: {A: 90, B: 80, C: 70, D: 60, F: 0}

actions:
  mode: report_only               # the only supported mode
  allow_delete: false             # must be false
  allow_pause: false              # must be false
  min_candidate_confidence: 70    # *_candidate below this (or unknown) becomes review
