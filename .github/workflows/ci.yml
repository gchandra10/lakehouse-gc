# Checks every push and pull request: lint, types, tests, and a wheel install smoke test.
# Also called by release.yml so a release can only be built from a passing commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported range: 3.10 (Databricks Runtime 13.3 LTS) to 3.14. To support a newer
        # Python, add it here and as a classifier in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }} # overrides .python-version for every uv command
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6" # keep in sync with [tool.uv] required-version in pyproject.toml
          checksum: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645" # linux x86_64
          enable-cache: true

      # uv.lock may be generated behind a PyPI mirror (e.g. a corporate proxy) that GitHub
      # runners cannot reach. Mirrors serve the same files, so point the URLs at public
      # PyPI; the hashes in the lock still verify every download.
      - name: Point uv.lock at public PyPI
        run: |
          perl -pi -e 's#https://[a-z0-9.-]*pypi-proxy[a-z0-9.-]*/simple/#https://pypi.org/simple#g; s#https://[a-z0-9.-]*pypi-proxy[a-z0-9.-]*/packages/#https://files.pythonhosted.org/packages/#g' uv.lock
          if grep -q pypi-proxy uv.lock; then
            echo "::error::uv.lock still references a proxy after rewriting"
            exit 1
          fi

      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke test the built wheel in a clean environment
        run: |
          uv venv --no-project /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "import lakehouse_gc; print('installed', lakehouse_gc.__version__)"
