[project]
name = "lakehouse-gc"
dynamic = ["version"]
description = "Report-only governance, cost, and hygiene assessment framework for Databricks lakehouses."
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/lakehouse_gc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_gc"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "examples",
    "README.md",
    "docs",
    "LICENSE",
    "NOTICE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks provide `spark`, `display`, and `dbutils` as globals, and import
# per cell so each cell reads on its own.
"examples/*.py" = ["F821", "E402"]
